name: config-processor

on:
  schedule:
    - cron: "*/15 * * * *"   # هر 15 دقیقه
  workflow_dispatch:         # مهم: برای دکمه Run دستی

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      # 1. گرفتن کد پروژه
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. نصب Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. نصب dependencies (اگر داری)
      - name: Install requirements
        run: |
          if [ -f config/requirements.txt ]; then pip install -r config/requirements.txt; fi

      # 4. اجرای processor
      - name: Run processor
        run: |
          python src/processor.py

      # 5. Commit کردن خروجی
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add recent_servers.txt data/state.json || true

          git commit -m "update processed configs" || true

          git push || true
